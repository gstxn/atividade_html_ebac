<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário para Cadastro</title>
</head>
<body>
    <h1>Formulário</h1>
    <label for="usuario">Usuário: </label>
    <input id="usuario" type="text" placeholder="Seu melhor usuário"> <br />

    <label for="email">Seu email: </label>
    <input id="email" type="text" placeholder="Seu melhor email"> <br />

    <label for="senha">Senha: </label>
    <input id="senha" type="password" placeholder="Sua senha"> <br />

    <button type="submit">Cadastrar</button>
</body>
</html>
